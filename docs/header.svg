<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradientBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradientText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#gradientBg)"/>
  
  <!-- Animated grid background -->
  <g opacity="0.1" stroke="#60a5fa" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="500" y1="0" x2="500" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="700" y1="0" x2="700" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="900" y1="0" x2="900" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
    <line x1="1100" y1="0" x2="1100" y2="300"/>
  </g>
  
  <!-- Left gear decoration -->
  <g transform="translate(100, 150)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Gear teeth -->
    <g stroke="#60a5fa" stroke-width="2" fill="none">
      <line x1="0" y1="-45" x2="0" y2="-55"/>
      <line x1="32" y1="-32" x2="39" y2="-39"/>
      <line x1="45" y1="0" x2="55" y2="0"/>
      <line x1="32" y1="32" x2="39" y2="39"/>
      <line x1="0" y1="45" x2="0" y2="55"/>
      <line x1="-32" y1="32" x2="-39" y2="39"/>
      <line x1="-45" y1="0" x2="-55" y2="0"/>
      <line x1="-32" y1="-32" x2="-39" y2="-39"/>
    </g>
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="8" fill="#60a5fa"/>
  </g>
  
  <!-- Right gear decoration -->
  <g transform="translate(1100, 150)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Gear teeth -->
    <g stroke="#60a5fa" stroke-width="2" fill="none">
      <line x1="0" y1="-45" x2="0" y2="-55"/>
      <line x1="32" y1="-32" x2="39" y2="-39"/>
      <line x1="45" y1="0" x2="55" y2="0"/>
      <line x1="32" y1="32" x2="39" y2="39"/>
      <line x1="0" y1="45" x2="0" y2="55"/>
      <line x1="-32" y1="32" x2="-39" y2="39"/>
      <line x1="-45" y1="0" x2="-55" y2="0"/>
      <line x1="-32" y1="-32" x2="-39" y2="-39"/>
    </g>
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="8" fill="#60a5fa"/>
  </g>
  
  <!-- Central clock icon -->
  <g transform="translate(600, 80)" filter="url(#glow)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#gradientText)" stroke-width="3"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
    
    <!-- Clock hands -->
    <line x1="0" y1="0" x2="0" y2="-25" stroke="url(#gradientText)" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="18" y2="12" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Center dot -->
    <circle cx="0" cy="0" r="5" fill="url(#gradientText)"/>
    
    <!-- Hour markers -->
    <circle cx="0" cy="-38" r="2" fill="#60a5fa"/>
    <circle cx="27" cy="-27" r="2" fill="#60a5fa"/>
    <circle cx="38" cy="0" r="2" fill="#60a5fa"/>
    <circle cx="27" cy="27" r="2" fill="#60a5fa"/>
  </g>
  
  <!-- Main Title -->
  <text x="600" y="180" font-size="72" font-weight="bold" text-anchor="middle" fill="url(#gradientText)" font-family="Arial, sans-serif" filter="url(#shadow)">
    StepperClock
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="230" font-size="20" text-anchor="middle" fill="#93c5fd" font-family="Arial, sans-serif" opacity="0.9">
    Orologio a Motore Passo-Passo
  </text>
  
  <!-- Bottom accent line -->
  <line x1="300" y1="260" x2="900" y2="260" stroke="url(#gradientText)" stroke-width="2" opacity="0.6"/>
  
  <!-- Decorative elements -->
  <g opacity="0.2" fill="#60a5fa">
    <circle cx="150" cy="50" r="3"/>
    <circle cx="250" cy="280" r="3"/>
    <circle cx="1050" cy="60" r="3"/>
    <circle cx="950" cy="270" r="3"/>
  </g>
</svg>